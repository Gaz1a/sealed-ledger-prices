name: Design audit (Impeccable detector)
# Manual only: run from the Actions tab after a ledger redesign. No schedule.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: "1"   # Impeccable telemetry off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Source scan (pattern rules)
        run: |
          npx -y impeccable detect --json design_audit/pages > design_audit/source.json || true
      - name: Rendered scan (contrast, tiny text) via local server
        run: |
          python3 -m http.server 8765 --directory design_audit/pages >/dev/null 2>&1 &
          sleep 2
          for p in pokemon lorcana wrestling football; do
            npx -y impeccable detect --json "http://localhost:8765/$p.html" > "design_audit/rendered_$p.json" || true
          done
      - name: Commit report
        run: |
          date -u +%FT%TZ > design_audit/last_run.txt
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add design_audit/*.json design_audit/last_run.txt
          git diff --cached --quiet || git commit -m "design audit $(date -u +%F)"
          git pull --rebase && git push
