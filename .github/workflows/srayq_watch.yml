name: Rayquaza SIR watch
on:
  schedule: [{ cron: "40 17 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/srayq_watch.py
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -f srayq_watch.json
          git diff --cached --quiet || git commit -m "srayq watch"
          git pull --rebase
          git push
