name: CardNexus audit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run audit
        env:
          CARDNEXUS_TOKEN: ${{ secrets.CARDNEXUS_TOKEN }}
        run: python scripts/cardnexus_audit.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add cardnexus_audit.json || true
          git diff --cached --quiet || git commit -m "cardnexus audit"
          git pull --rebase
          git push
