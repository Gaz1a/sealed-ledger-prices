name: Ledger images (fill missing)
on:
  workflow_dispatch:
  schedule: [{ cron: "50 10 * * *" }]
  push:
    paths: [ledger_image_map.json, ledger_ids.json, scripts/ledger_images.py]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/ledger_images.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -f images
          git diff --cached --quiet || git commit -m "ledger images"
          git pull --rebase
          git push
