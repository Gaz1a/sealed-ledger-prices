name: Booklet prices and buy scan
on:
  schedule: [{cron: "20 10 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/bk_booklets.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Commit
        run: |
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add booklet_prices.json booklet_hits.json
          git diff --cached --quiet || git commit -m "booklets $(date -u +%F)"
          git pull --rebase && git push
