name: Fetch prices
on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tracked duplicate guard
        run: python scripts/tracked_guard.py
      - run: python scripts/fetch_prices.py
      - name: Feed staleness check
        run: python scripts/feed_staleness.py
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add tracked.json tracked_guard.json prices.json group-map.json feed_staleness.json ebay_supply.json
          git diff --cached --quiet || git commit -m "prices $(date -u +%F)"
          git push
