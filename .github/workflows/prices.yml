name: Fetch prices
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_prices.py
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json group-map.json
          git diff --cached --quiet || git commit -m "prices $(date -u +%F)"
          git push
