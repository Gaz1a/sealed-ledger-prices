name: Flash bargains (every 3 hours)
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: { group: flash, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: gh label create bargain --color FF5A36 --description "Buy-it-now at or under target" 2>/dev/null || true
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: python scripts/flash_bin.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add flash.json
          git diff --cached --quiet || git commit -m "flash scan $(date -u +%FT%H:%M)"
          git pull --rebase && git push
