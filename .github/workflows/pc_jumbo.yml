name: PriceCharting jumbo
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/pc_jumbo.py
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -f pricecharting.json
          git diff --cached --quiet || git commit -m "pricecharting jumbo $(date -u +%F)"
          git pull --rebase
          git push
