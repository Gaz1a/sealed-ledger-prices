name: Verify buy candidates (eBay API)
on:
  schedule: [{ cron: "25 16 * * *" }]   # 9:25am PT, just before the Buy Hunter (9:52am PT)
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: commit-main, cancel-in-progress: false }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/verify_listings.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - run: |
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add verified.json
          git commit -qm "verified candidates $(date -u +%FT%H:%M)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
