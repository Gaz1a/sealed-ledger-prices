name: Verify buy candidates (eBay API)
on:
  schedule: [{ cron: "25 16 * * *" }]   # 9:25am PT, just before the Buy Hunter (9:52am PT)
  workflow_run:   # cron runs hours late: also run after the photo check, once per day after 15:00 UTC (guard below)
    workflows: ["Photo check (raw-card candidates)"]
    types: [completed]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: commit-main, cancel-in-progress: false }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: due
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime, os
          now = datetime.datetime.now(datetime.timezone.utc)
          try: g = datetime.datetime.fromisoformat(json.load(open("verified.json"))["generated"])
          except Exception: g = None
          cut = now.replace(hour=15, minute=0, second=0, microsecond=0)
          manual = os.environ.get("EV") == "workflow_dispatch"
          print("run=" + ("true" if manual or (now >= cut and (g is None or g < cut)) else "false"))
          PY
        env: { EV: "${{ github.event_name }}" }
      - if: steps.due.outputs.run == 'true'
        run: python scripts/verify_listings.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - if: steps.due.outputs.run == 'true'
        run: |
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add verified.json
          git commit -qm "verified candidates $(date -u +%FT%H:%M)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
