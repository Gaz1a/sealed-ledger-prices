name: PSA population
# PARKED: PSA ended its free API. Manual dispatch only; scripts kept for later.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Find spec IDs (eBay certs -> PSA verification)
        run: python scripts/psa_find_specs.py
        env:
          PSA_TOKEN: ${{ secrets.PSA_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Population pull
        run: python scripts/psa_pop.py
        env:
          PSA_TOKEN: ${{ secrets.PSA_TOKEN }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add psa_pop.json psa_specs.json psa_find_state.json
          git diff --cached --quiet || git commit -m "psa pop $(date -u +%F)"
          git pull --rebase
          git push
