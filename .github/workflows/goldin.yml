name: Goldin scan (Wed + Sat)
on:
  schedule:
    - cron: "15 13 * * 3,6"
  workflow_dispatch:
permissions: {contents: write, issues: write}
concurrency: {group: goldin, cancel-in-progress: false}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Scan Goldin
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
        run: python3 scripts/goldin_scan.py --sold 10
      - name: Bid sheet (GitHub emails it)
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: python3 scripts/goldin_notify.py
      - name: Commit
        run: |
          git config user.name ledger-bot; git config user.email bot@users.noreply.github.com
          git add goldin.json goldin_sold.json
          git commit -m "goldin scan $(date -u +%FT%H:%M)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
