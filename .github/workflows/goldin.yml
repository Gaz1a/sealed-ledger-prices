name: Auction scan (Goldin + Fanatics Collect)
on:
  schedule:
    - cron: "15 13 * * 3"     # Wednesday ~5am PT: full bid sheet for the week
    - cron: "15 15 * * 0"     # Sunday ~7am PT: refresh before the Sunday 7pm PT close
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: goldin, cancel-in-progress: false}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Scan Goldin
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
        run: python3 scripts/goldin_scan.py --sold 10
      - name: Scan Fanatics Collect
        continue-on-error: true
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
        run: FAN_DEBUG=1 python3 scripts/fanatics_scan.py
      - name: Record how earlier picks closed
        continue-on-error: true
        run: python3 scripts/auction_results.py
      - name: Budget-capped sheet for the ledger's Buy tab
        run: pip install --quiet pillow && python3 scripts/auction_sheet.py
      - name: Commit
        run: |
          git config user.name ledger-bot; git config user.email bot@users.noreply.github.com
          git add -A auction_thumbs; for f in auction_sheet.json goldin.json goldin_sold.json fanatics.json fanatics_sold.json auction_results.json data/auction_picks.json; do [ -e "$f" ] && git add "$f"; done
          git commit -m "auction scan $(date -u +%FT%H:%M)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
