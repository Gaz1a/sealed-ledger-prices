name: Graded reference
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  graded:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/graded_extend.py
      - run: python scripts/graded_pull.py
        env:
          PPT_KEY: ${{ secrets.PPT_KEY }}
      - run: python scripts/graded_premium.py
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add graded.json graded_watch.json
          git diff --cached --quiet || git commit -m "graded reference $(date -u +%F)"
          git pull --rebase && git push
