name: Grade my cards (own photos)
on:
  push:
    paths: ["grading/submissions/**"]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: grade-own, cancel-in-progress: false}
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: dinov2-small-v1 }
      - run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet timm opencv-python-headless numpy
      - run: python scripts/grade_own.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - run: |
          git config user.name ledger-bot; git config user.email bot@users.noreply.github.com
          git add grading/results.json grading/sheets
          git commit -m "grade own cards" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
