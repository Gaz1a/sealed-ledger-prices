name: Jumbo scan
on:
  workflow_dispatch:
  schedule:
    - cron: "25 14 * * *"
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/jumbo_scan.py
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -f jumbo_ids.json jumbo_prices.json
          git diff --cached --quiet || git commit -m "jumbo scan $(date -u +%F)"
          git pull --rebase
          git push
