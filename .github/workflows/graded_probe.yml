name: Graded probe
on: workflow_dispatch
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/graded_probe.py
        env:
          PPT_KEY: ${{ secrets.PPT_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add graded_probe.json
          git diff --cached --quiet || (git commit -m "graded probe" && git pull --rebase && git push)
