name: Release calendar scan
on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays ~6:17am PT
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/releases_scan.py
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add releases.json
          git diff --cached --quiet || git commit -m "release calendar $(date -u +%F)"
          git pull --rebase
          git push
