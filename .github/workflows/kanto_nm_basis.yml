name: Kanto NM basis (audit)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/kanto_nm_basis.py
        env:
          PPT_KEY: ${{ secrets.PPT_KEY }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -f kanto_nm_basis.json
          git diff --cached --quiet || git commit -m "kanto NM basis (audit)"
          git pull --rebase
          git push
