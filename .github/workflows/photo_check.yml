name: Photo check (raw-card candidates)
on:
  schedule:
    - cron: "50 */3 * * *"   # 30 min after each flash scan; also covers the 12:50 UTC wants scan
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: photos, cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: dinov2-small-v1 }
      - run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet timm opencv-python-headless numpy
      - run: python scripts/photo_check.py "$RUNNER_TEMP/photos"
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Publish to the photos branch (overwritten each run, no history)
        run: |
          cd "$RUNNER_TEMP/photos"
          git init -q -b photos
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add -A && git commit -qm "photo check $(date -u +%FT%H:%M)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" photos
