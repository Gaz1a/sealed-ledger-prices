name: Graded pull
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1"
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/graded_pull.py
        env:
          PPT_KEY: ${{ secrets.PPT_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add graded.json graded_watch.json
          git diff --cached --quiet || git commit -m "graded pull"
          git pull --rebase && git push
