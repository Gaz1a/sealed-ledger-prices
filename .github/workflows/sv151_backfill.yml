name: SV151 backfill
on:
  # schedule paused 2026-10-24: backfill complete (backfillComplete true); dispatch manually if needed
  workflow_dispatch:
permissions: {contents: write, actions: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/sv151_backfill_ppt.py
        env:
          PPT_KEY: ${{ secrets.PPT_KEY }}
      - run: python scripts/sv151_value.py
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add sv151_ppt_state.json sv151_value.json sv151_lines.json sv151_history.json sv151_backfill.json
          git diff --cached --quiet || git commit -m "sv151 backfill $(date -u +%F)"
          git pull --rebase && git push
      - name: Disable when done
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json,sys; sys.exit(0 if json.load(open('sv151_backfill.json'))['backfillComplete'] else 1)" && gh api -X PUT repos/${{ github.repository }}/actions/workflows/sv151_backfill.yml/disable || echo "not complete yet"
