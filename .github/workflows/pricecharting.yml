name: PriceCharting
on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"
permissions:
  contents: write
jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/pricecharting_cards.py
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
      - run: python scripts/graded_premium.py
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add pricecharting.json pricecharting_ids.json graded.json
          git diff --cached --quiet || git commit -m "pricecharting $(date -u +%F)"
          git pull --rebase
          git push
