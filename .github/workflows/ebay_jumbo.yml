name: Jumbo eBay scan
on:
  schedule: [{ cron: "50 12 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/scan_ebay_jumbo.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -f ebay_jumbo.json ebay_wants.json ebay_sealed.json
          git diff --cached --quiet || git commit -m "jumbo eBay scan $(date -u +%F)"
          git pull --rebase
          git push
