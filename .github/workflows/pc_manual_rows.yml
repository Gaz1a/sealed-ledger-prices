name: PC manual rows
on:
  schedule: [{cron: "30 15 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/pc_manual_rows.py
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -f h_manual_pc_prices.json
          git diff --cached --quiet || git commit -m "pc manual rows"
          git pull --rebase
          git push
