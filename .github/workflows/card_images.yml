name: Card images
on:
  schedule: [{ cron: "30 8 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/card_images.py
      - run: python scripts/product_images.py
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -f images
          git diff --cached --quiet || git commit -m "card images"
          git pull --rebase
          git push
