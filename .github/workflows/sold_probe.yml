name: Sold prices probe (one-off)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/sold_probe.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - run: |
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add data/sold_probe.json && git commit -qm probe && git pull -q --rebase && git push -q
