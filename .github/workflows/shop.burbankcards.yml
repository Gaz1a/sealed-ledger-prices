name: Burbank Cards shop scan
on:
  schedule:
    - cron: "0 14 * * *"   # daily, 6am PT (7am during PDT->PST shift, close enough) — before a typical visit
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/scan_shop_burbankcards.py
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add shop_burbankcards.json
          git diff --cached --quiet || git commit -m "Burbank Cards shop scan $(date -u +%F)"
          git pull --rebase
          git push
