name: Sales signals resume
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/sales_signals_resume.py
        env:
          PPT_KEY: ${{ secrets.PPT_KEY }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -f sales_signals_raw.json
          git diff --cached --quiet || git commit -m "sales signals probe"
          git pull --rebase
          git push
