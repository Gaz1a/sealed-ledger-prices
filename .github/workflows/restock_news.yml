name: Restock news
on:
  workflow_dispatch:
  schedule:
    - cron: "35 15 * * *"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/restock_news.py
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add restock_news.json
          git diff --cached --quiet || git commit -m "restock news $(date -u +%F)"
          git pull --rebase
          git push
