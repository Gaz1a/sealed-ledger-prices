name: SV151 images
on:
  workflow_dispatch:
  push:
    paths: [sv151_lines.json, scripts/sv151_images.py]
  schedule: [{ cron: "40 8 * * 1" }]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/sv151_images.py
      - if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -f images
          git diff --cached --quiet || git commit -m "sv151 images"
          git pull --rebase
          git push
