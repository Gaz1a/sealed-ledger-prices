name: Release buzz
on:
  schedule:
    - cron: "15 23 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/scan_release_buzz.py
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add buzz.json buzz.md
          git diff --cached --quiet || git commit -m "buzz $(date -u +%F)"
          git pull --rebase
          git push
