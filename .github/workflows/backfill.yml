name: Backfill prices (one-off)
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        default: "31"
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install 7z
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
      - name: Backfill from tcgcsv archive
        env:
          DAYS: ${{ inputs.days }}
        run: |
          cat > backfill_prices.py <<'PYEOF'
          #!/usr/bin/env python3
          """One-off backfill: daily TCGplayer market prices from tcgcsv.com's archive for every
          product in tracked.json. Writes backfill.json {ledgerId: [[date, market], ...]}.
          Same variant-picking rules as scripts/fetch_prices.py so history matches the nightly feed."""
          import json, os, sys, subprocess, shutil, tempfile, datetime

          DAYS = int(os.environ.get("DAYS") or "31")
          CATS = [3, 85, 68, 71, 86, 89]
          tracked = json.load(open("tracked.json"))
          gmap = json.load(open("group-map.json"))
          want = {}
          for lid, t in tracked.items():
              want.setdefault(str(t["productId"]), []).append((lid, t.get("variant")))
          needed = sorted({tuple(gmap[p]) for p in want if p in gmap})
          nomap = [p for p in want if p not in gmap]

          def pick(rows, variant):
              rows = [r for r in rows if r.get("marketPrice") is not None]
              if not rows: return None
              if variant:
                  m = [r for r in rows if r["subTypeName"] == variant]
                  if m: return m[0]
              if len(rows) == 1: return rows[0]
              for pref in ("Normal", "Unlimited Holofoil", "Holofoil", "Reverse Holofoil",
                           "1st Edition Holofoil", "1st Edition", "Unlimited"):
                  m = [r for r in rows if r["subTypeName"] == pref]
                  if m: return m[0]
              return sorted(rows, key=lambda r: r["subTypeName"])[0]

          def rows_from_tree(root):
              """Walk an extracted archive; return {productId: [rows]} for wanted products."""
              found = {}
              for dp, _dn, fn in os.walk(root):
                  if "prices" not in fn: continue
                  try:
                      d = json.load(open(os.path.join(dp, "prices")))
                  except Exception:
                      continue
                  for r in d.get("results", []):
                      pid = str(r.get("productId"))
                      if pid in want:
                          found.setdefault(pid, []).append(r)
              return found

          def sh(cmd):
              return subprocess.call(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          def fetch_day(day):
              url = f"https://tcgcsv.com/archive/tcgplayer/prices-{day}.ppmd.7z"
              tmp = tempfile.mkdtemp()
              try:
                  arc = os.path.join(tmp, "a.7z"); out = os.path.join(tmp, "x")
                  if subprocess.call(["curl", "-sSL", "--retry", "3", "--fail", "-o", arc, url]) != 0:
                      return None, "download failed (archive may not exist yet)"
                  # 1) only the groups we need  2) whole tracked categories  3) everything
                  attempts = [[f"*/{c}/{g}/prices" for c, g in needed],
                              [f"*/{c}/*" for c in CATS],
                              []]
                  for pats in attempts:
                      shutil.rmtree(out, ignore_errors=True)
                      sh(["7z", "x", "-y", "-bd", "-o" + out, arc] + pats)
                      found = rows_from_tree(out)
                      if found: return found, None
                  return None, "no price rows found after extraction"
              finally:
                  shutil.rmtree(tmp, ignore_errors=True)

          today = datetime.datetime.utcnow().date()
          days = [(today - datetime.timedelta(days=i)).isoformat() for i in range(DAYS, -1, -1)]
          history, skipped = {}, {}
          for day in days:
              found, err = fetch_day(day)
              if found is None:
                  skipped[day] = err; print("SKIP", day, err, flush=True); continue
              n = 0
              for pid, entries in want.items():
                  for lid, variant in entries:
                      r = pick(found.get(pid, []), variant)
                      if r is None: continue
                      history.setdefault(lid, []).append([day, r["marketPrice"]]); n += 1
              print("OK", day, n, "prices", flush=True)

          json.dump({"generated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                     "source": "tcgcsv.com daily archive (TCGplayer market price)",
                     "days_requested": days, "skipped_days": skipped,
                     "products_without_group_map": nomap, "history": history},
                    open("backfill.json", "w"), separators=(",", ":"), sort_keys=True)
          ok = len(days) - len(skipped)
          print(f"done: {ok}/{len(days)} days, {len(history)} ledger ids")
          if ok < 5: sys.exit("fewer than 5 days retrieved; check the archive URL/layout in the log")
          PYEOF
          python3 backfill_prices.py
      - name: Commit result
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add backfill.json
          git diff --cached --quiet || git commit -m "backfill $(date -u +%F)"
          git push
