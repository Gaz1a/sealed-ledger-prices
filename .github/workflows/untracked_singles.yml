name: Untracked singles audit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/untracked_singles.py
        env:
          CARDNEXUS_TOKEN: ${{ secrets.CARDNEXUS_TOKEN }}
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -f untracked_singles.json
          git diff --cached --quiet || git commit -m "untracked singles audit $(date -u +%F)"
          git pull --rebase
          git push
