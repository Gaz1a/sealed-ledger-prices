name: Auction probe
on: workflow_dispatch
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/auction_probe.py
      - run: |
          git config user.name ledger-bot; git config user.email bot@users.noreply.github.com
          git add auction_probe.txt; git commit -m "auction probe" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
