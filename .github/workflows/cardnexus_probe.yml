name: CardNexus probe
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run probe
        env:
          CARDNEXUS_TOKEN: ${{ secrets.CARDNEXUS_TOKEN }}
        run: python scripts/cardnexus_probe.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add cardnexus_probe.json cardnexus_openapi.json 2>/dev/null || true
          git commit -m "CardNexus probe results" || echo "nothing to commit"
          git pull --rebase
          git push
