name: SIR lookup
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/sir_lookup.py
        env:
          PPT_KEY: ${{ secrets.PPT_KEY }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -f sir_lookup.json
          git diff --cached --quiet || git commit -m "sir lookup"
          git pull --rebase
          git push
