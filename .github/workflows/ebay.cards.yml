name: Card ledger eBay scan
on:
  schedule:
    - cron: "40 23 * * 0"   # Sundays 23:40 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/scan_ebay_cards.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add cards/ebay_cards.json
          git diff --cached --quiet || git commit -m "card ebay scan $(date -u +%F)"
          git pull --rebase
          git push
